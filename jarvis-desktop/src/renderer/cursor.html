<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Jarvis cursor</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:600 13px/1.3 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  #c{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:transform .55s cubic-bezier(.2,1.1,.3,1),opacity .25s}
  #c.on{opacity:1}
  /* arrow + glow */
  .arrow{position:absolute;left:-3px;top:-2px;width:26px;height:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(124,92,255,.8))}
  .halo{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.35),rgba(124,92,255,0) 70%);animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.35);opacity:.6}}
  .ripple{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid #7c5cff;opacity:0}
  #c.click .ripple{animation:ripple .5s ease-out}
  @keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
  .label{position:absolute;left:22px;top:22px;background:#000;color:#fff;padding:7px 11px;border-radius:12px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid rgba(124,92,255,.6)}
  .label:empty{display:none}
  .label::before{content:"Jarvis  ";color:#a996ff}
</style>
</head>
<body>
<div id="c">
  <div class="halo"></div>
  <div class="ripple"></div>
  <svg class="arrow" viewBox="0 0 26 30"><path d="M3 2 L3 24 L9 18.5 L13 28 L17 26.3 L13 17 L21 17 Z" fill="#7c5cff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div class="label" id="label"></div>
</div>
<script src="cursor.js"></script>
</body>
</html>
